name: FastAPI CD

on:
  push:
    branches: ['release']

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Create .env file
        run: |
          cd Sever-Model
          touch .env
          echo "${{ secrets.ENV_FILE }}" > .env
        shell: bash

      - name: Install dependencies
        run: |
          cd Sever-Model
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Docker image build
        run: |
          cd Sever-Model
          docker build -f docker/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/fastapi-diary:latest .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/fastapi-diary:latest

      - name: Send docker-compose.yml to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          source: 'Sever-Model/docker/docker-compose.yaml'
          target: '/home/ubuntu/fastapi'
          strip_components: 2

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          script: |
            cd /home/ubuntu/fastapi
            sudo docker-compose down -v
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/fastapi-diary:latest
            sudo docker-compose up -d
            sudo docker image prune -a -f
